## Multi-Agent Coordination

복합 작업 시 여러 agent 조합:

| 작업 유형 | Agent 조합 |
|----------|-----------|
| 번역 기능 개선 | ai-chain + editor |
| 검수 기능 버그 | review + store-sync + editor |
| MCP 연동 추가 | mcp-connector + tauri-bridge |
| 채팅 UX 개선 | ai-chain + store-sync |
| 저장/로드 버그 | store-sync + tauri-bridge |

## Checklist

Issue 분석 시:
- [ ] 변경 파일 전체 목록 수집
- [ ] 파일별 패턴 매핑 수행
- [ ] 키워드 기반 도메인 분석
- [ ] 관련 TRD 섹션 특정
- [ ] AGENTS.md 관련 항목 검색
- [ ] 체크리스트 자동 생성
- [ ] Agent 우선순위 결정

## Activation Triggers

- PR 생성/수정 시
- Issue 분석 요청
- "어떤 문서 봐야 해?", "관련 agent?"
- 복잡한 변경사항 리뷰 시
- "분석해줘", "analyze"
- 새 기능 구현 시작 전"""
